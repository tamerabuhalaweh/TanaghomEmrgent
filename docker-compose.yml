services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-tanaghum}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UNIVERSAL_LLM_KEY: ${UNIVERSAL_LLM_KEY:-}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-https://api.thesmartlabs.net/gemma4/v1}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4-26b-a4b-canary}
      GHL_READ_SYNC_ENABLED: ${GHL_READ_SYNC_ENABLED:-false}
      PORT: 8000
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
